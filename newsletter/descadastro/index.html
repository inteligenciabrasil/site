<head>
    <meta charset="UTF-8">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://cdn.jsdelivr.net https://vlibras.gov.br https://challenges.cloudflare.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://vlibras.gov.br; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://fonts.googleapis.com https://cloudflare-dns.com https://dns.google https://vlibras.gov.br https://api.ipify.org https://challenges.cloudflare.com; frame-src https://www.googletagmanager.com https://challenges.cloudflare.com; form-action 'self' https://script.google.com; base-uri 'self'; object-src 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Cancelamento de inscrição na newsletter da Inteligência Brasil.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0D1E38">
    <link rel="canonical" href="https://inteligenciabrasil.seg.br/newsletter/descadastro/">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="shortcut icon" type="image/x-icon" href="/img/favicon.ico">
    <title>Cancelar inscrição | Inteligência Brasil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/fontawesome-subset.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0D1E38;
            --accent-primary: #60A5FA;
            --accent-green: #34D399;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --border-radius-pill: 9999px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .status-container { max-width: 600px; }
        .logo { margin-bottom: 2rem; width: 180px; height: auto; filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.3)); }
        .status-icon { font-size: 4rem; line-height: 1; margin-bottom: 1.5rem; }
        .status-icon.pending { color: var(--accent-primary); }
        .status-icon.success { color: var(--accent-green); text-shadow: 0 0 40px rgba(52, 211, 153, 0.35); }
        .status-icon.error   { color: #F59E0B; }
        .status-title { font-size: 1.75rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-primary); }
        .status-message { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 2.5rem; line-height: 1.7; }
        .status-message a { color: var(--accent-primary); }
        .status-links { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
        .btn-home {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 16px 32px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: #FFFFFF; font-weight: 600; text-decoration: none;
            border-radius: var(--border-radius-pill);
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        .btn-home:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(16, 185, 129, 0.5); color: #FFFFFF; }
        .btn-secondary, .btn-danger {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 28px;
            background: transparent;
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: var(--accent-primary);
            font-family: inherit; font-size: 1rem; font-weight: 600;
            text-decoration: none; cursor: pointer;
            border-radius: var(--border-radius-pill);
            transition: all 0.3s ease;
        }
        .btn-secondary:hover { background: rgba(96, 165, 250, 0.1); border-color: var(--accent-primary); color: var(--accent-primary); }
        .btn-danger { border-color: rgba(245, 158, 11, 0.5); color: #F59E0B; }
        .btn-danger:hover { background: rgba(245, 158, 11, 0.1); border-color: #F59E0B; }
        .btn-danger[disabled] { opacity: 0.5; cursor: default; }
        .skip-link { position: absolute; left: -9999px; }
        .skip-link:focus { left: 1rem; top: 1rem; background: #fff; color: #0D1E38; padding: .5rem 1rem; border-radius: 4px; }
        /* .fa-spin e @keyframes fa-spin ja vem do fontawesome-subset; so falta o respeito a preferencia */
        @media (prefers-reduced-motion: reduce) { .fa-spin { animation: none; } }
        @media (max-width: 576px) {
            .status-title { font-size: 1.25rem; }
            .status-message { font-size: 1rem; }
        }
    </style>
</head>
<body><a class="skip-link" href="#main-content">Pular para conte&uacute;do</a>
    <main id="main-content">
    <div class="status-container">
        <img src="/img/logo-white-196x196.png" alt="Inteligência Brasil" class="logo" width="180" height="180">
        <div class="status-icon pending" id="st-icon"><i class="fas fa-envelope-open"></i></div>
        <h1 class="status-title" id="st-title">Cancelar inscrição</h1>
        <p class="status-message" id="st-msg">Você está prestes a cancelar sua inscrição na newsletter da Inteligência Brasil. Nada é cancelado até você confirmar abaixo.</p>
        <noscript>
            <p class="status-message">
                Seu navegador está com JavaScript desativado. Escreva para
                <a href="mailto:contato@inteligenciabrasil.seg.br">contato@inteligenciabrasil.seg.br</a>
                que cancelamos sua inscrição manualmente.
            </p>
        </noscript>
        <div class="status-links">
            <button type="button" id="st-go" class="btn-danger"><i class="fas fa-times-circle"></i> Confirmar cancelamento</button>
            <a href="/" class="btn-home"><i class="fas fa-home"></i> Voltar ao Início</a>
        </div>
    </div>
    </main>

    <script>
    (function(){
        // O descadastro NUNCA acontece no carregamento: so no clique, e so por POST.
        // Varredura de link de e-mail corporativo segue GET/abre a pagina sozinha --
        // sem o botao, um scanner descadastraria o inscrito por conta propria.
        // credentials:'omit' e obrigatorio -- com os cookies de sessao Google o endpoint
        // que serve o corpo responde 403 (medido em producao, smoke N6 do 08-06).
        var EXEC = 'https://script.google.com/a/inteligenciabrasil.seg.br/macros/s/AKfycbzzkHQxLsw0M5wU1LF2maVkF_piJiERJU34NCzE9g/exec';
        var icon = document.getElementById('st-icon');
        var title = document.getElementById('st-title');
        var msg = document.getElementById('st-msg');
        var btn = document.getElementById('st-go');

        function show(state, iconClass, titleText, msgText) {
            icon.className = 'status-icon ' + state;
            icon.innerHTML = '<i class="fas ' + iconClass + '"></i>';
            title.textContent = titleText;
            msg.textContent = msgText;
        }

        var token = (new URLSearchParams(window.location.search)).get('t') || '';

        btn.addEventListener('click', function(){
            btn.disabled = true;
            msg.textContent = 'Processando...';

            fetch(EXEC, {
                method: 'POST',
                credentials: 'omit',
                body: new URLSearchParams({ action: 'do_unsub', token: token })
            })
            .then(function(r){ return r.json(); })
            .then(function(d){
                if (d && d.result === 'success') {
                    btn.style.display = 'none';
                    show('success', 'fa-check-circle', 'Inscrição cancelada',
                         'Pronto. Você não vai mais receber a newsletter da Inteligência Brasil.');
                } else {
                    btn.disabled = false;
                    // Mensagem neutra: nao revela se o token existe, ja foi usado ou expirou.
                    show('error', 'fa-exclamation-circle', 'Link inválido ou já utilizado',
                         'Não foi possível cancelar por este link. Escreva para contato@inteligenciabrasil.seg.br que cancelamos manualmente.');
                }
            })
            .catch(function(){
                btn.disabled = false;
                show('error', 'fa-exclamation-circle', 'Falha de conexão',
                     'Não conseguimos cancelar sua inscrição agora. Tente novamente ou escreva para contato@inteligenciabrasil.seg.br.');
            });
        });
    })();
    </script>

    <!-- VLibras - Acessibilidade em Libras (load on click) -->
    <div id="vlibras-placeholder" style="position:fixed;top:50%;right:24px;transform:translateY(-50%);z-index:9998;cursor:pointer" title="Traduzir para Libras" aria-label="Ativar VLibras - Tradutor de Libras">
        <img src="/img/vlibras-icon.svg" alt="VLibras" width="40" height="40" style="border-radius:8px;box-shadow:0 4px 15px rgba(54,144,250,0.3)">
    </div>
    <script>
    (function(){
        var ph=document.getElementById('vlibras-placeholder');
        if(!ph)return;
        ph.addEventListener('click',function(){
            ph.style.display='none';
            var wrap=document.createElement('div');
            wrap.setAttribute('vw','');
            wrap.className='enabled';
            wrap.innerHTML='<div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>';
            document.body.appendChild(wrap);
            var s=document.createElement('script');
            s.src='https://cdn.jsdelivr.net/gh/spbgovbr-vlibras/vlibras-portal@20e318bc62103e3423afb513de52494d691ccf77/app/vlibras-plugin.js';s.integrity='sha384-P+g9upWYCGbO2rB87dwrTJtCFqD63pUIT+w/qj5+K5Q1YnLAttGT+wBuoWqaXqXw';s.crossOrigin='anonymous';
            s.onload=function(){
                new window.VLibras.Widget('https://vlibras.gov.br/app');
                if(window.onload){var f=window.onload;window.onload=null;f()}
            };
            document.body.appendChild(s);
        });
    })();
    </script>
    <script src="/js/cookie-consent.min.js" defer></script>
</body>
</html>
