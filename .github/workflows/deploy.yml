name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # ponytail: deploy-only — arquivos gitignored não entram no checkout, então o
      # artefato já sobe só o site publicável. Adicionar um passo `pwsh` que roda
      # _build-sitemap/_build-rss-feed/_build-blog-index quando quiser regenerar os
      # índices no CI (atenção: pwsh no Linux é UTF-8, difere do seu PS5.1 CP-1252).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
